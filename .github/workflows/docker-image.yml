name: Docker Image CI/CD

on:
  push:
    branches: [ "main", "dev" ]          # build on both main and dev
    tags:     [ "v*.*.*", "*.*.*" ]      # build on version tags: v1.6.1 or 1.6.1
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free up disk space on runner
      if: runner.os == 'Linux'
      run: |
        echo "Initial free space:"
        df -h
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo docker image prune -a -f
        echo "Free space after cleanup:"
        df -h

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          # ── Branch-based tags ────────────────────────────────────────────────
          # dev branch   → :dev
          type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
          # main branch  → :latest
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

          # ── Git tag-based tags ───────────────────────────────────────────────
          # v1.6.1 or 1.6.1  → :1.6.1  (strips leading 'v' automatically)
          type=semver,pattern={{version}}
          # v1.6.1 or 1.6.1  → :1.6
          type=semver,pattern={{major}}.{{minor}}
          # any tag release   → :latest  (release tags are considered stable)
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

          # ── Traceability ─────────────────────────────────────────────────────
          # every build       → :sha-a1b2c3d  (short SHA, always present)
          type=sha,prefix=sha-,format=short

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64
        build-args: |
          BUILDKIT_INLINE_CACHE=1

    - name: Image digest
      if: github.event_name != 'pull_request'
      run: echo ${{ steps.meta.outputs.digest }}